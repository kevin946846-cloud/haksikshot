# 비밀값·개인정보가 저장소에 들어가지 않게 PR마다 자동 검사
# 1) gitleaks로 전체 커밋 이력을 검사 (API 키, 토큰, 비밀번호, 개인 이메일). 설정은 .gitleaks.toml
# 2) PR 커밋의 작성자 이메일이 GitHub noreply 주소인지 확인 (커밋 정보에 개인 이메일이 남지 않게)
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 설치 (버전 고정, 체크섬 확인)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: 전체 이력에서 비밀값·개인 이메일 검사
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: 커밋 작성자 이메일 확인 (noreply만 허용)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%h %ae %ce' "$BASE..$HEAD" | awk '$2 !~ /noreply/ || $3 !~ /noreply/')
          if [ -n "$bad" ]; then
            echo "::error::개인 이메일로 된 커밋이 있어요. git config user.email 을 GitHub noreply 주소로 바꾸고 다시 커밋하세요."
            echo "$bad" | awk '{print $1}'
            exit 1
          fi
          echo "작성자 이메일 모두 noreply"
