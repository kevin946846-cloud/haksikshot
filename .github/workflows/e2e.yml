name: e2e

# docker compose로 학식샷 전체(화면·API·로그인·사진 저장·서버 함수·DB)를 띄우고
# 실제 브라우저(Playwright)로 눌러 보며 처음부터 끝까지 확인
# → 운영 Supabase는 전혀 건드리지 않음 (테스트용 DB가 매번 새로 만들어졌다 사라짐)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: 학식샷 전체를 docker compose로 실행
        working-directory: .
        run: |
          docker compose up -d --build
          # 화면 + API(메뉴 43개) + 로그인이 모두 응답할 때까지 최대 4분
          for i in $(seq 1 120); do
            n=$(curl -fs "http://localhost:8080/rest/v1/menus?select=id" 2>/dev/null | grep -o '"id"' | wc -l || true)
            if [ "${n:-0}" = "43" ] && curl -fs http://localhost:8080/auth/v1/health > /dev/null; then echo "준비 완료 (${i}회)"; break; fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs migrate
          [ "${n:-0}" = "43" ] || { docker compose logs --tail 80; exit 1; }

      - name: Playwright 설치
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E 테스트
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: 다시 띄워도 안전한지 (마이그레이션은 건너뛰어야 함)
        working-directory: .
        run: |
          docker compose run --rm migrate | tee /tmp/migrate2.txt
          ! grep -q "^적용" /tmp/migrate2.txt
          grep -q "건너뜀" /tmp/migrate2.txt

      - name: 실패하면 서버 로그 보기
        if: failure()
        working-directory: .
        run: |
          echo "=== db 오류 ==="; docker compose logs --no-color db | grep -v "must be owner of function uid" | grep -n -B2 -A6 -E "ERROR|FATAL|psql:|exited|running /docker" | grep -v "STATEMENT" | head -150
          echo "=== 나머지 ==="; docker compose logs --no-color --tail 60 auth storage rest functions migrate web

      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
