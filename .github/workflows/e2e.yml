name: e2e

# 도커로 띄운 앱을 실제 브라우저(Playwright)로 눌러 보며 처음부터 끝까지 확인
# 서버는 운영 Supabase를 그대로 씀 → 테스트마다 새 익명 사용자로 들어가고, 끝나면 자기 기록을 지움
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: 앱을 도커로 실행
        working-directory: .
        run: |
          docker build -t haksikshot:e2e .
          docker run -d --name app -p 8080:8080 haksikshot:e2e
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done

      - name: Playwright 설치
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E 테스트
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
