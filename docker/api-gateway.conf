# 로컬 API 게이트웨이 (Docker Compose에서만 web 컨테이너에 끼워 넣음)
# 화면과 같은 주소(http://localhost:8080)로 백엔드를 묶어서 CORS 없이 동작:
#   /auth/v1      → auth     (익명 로그인, GoTrue)
#   /rest/v1      → rest     (DB를 API로, PostgREST)
#   /storage/v1   → storage  (사진 저장)
#   /functions/v1 → functions (사진 AI 확인 verify-photo)
# 실제 Supabase 클라우드의 주소 구조와 같아서 앱 코드는 그대로 씀
resolver 127.0.0.11 valid=10s ipv6=off;   # 도커 내부 DNS (컨테이너가 다시 떠도 새 주소를 찾음)
client_max_body_size 8m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

location /auth/v1/      { set $up auth:9999;      rewrite ^/auth/v1/(.*)$ /$1 break;      proxy_pass http://$up; }
location /rest/v1/      { set $up rest:3000;      rewrite ^/rest/v1/(.*)$ /$1 break;      proxy_pass http://$up; }
location /storage/v1/   { set $up storage:5000;   rewrite ^/storage/v1/(.*)$ /$1 break;   proxy_pass http://$up;
                          proxy_set_header X-Forwarded-Prefix /storage/v1; }
location /functions/v1/ { set $up functions:9000; rewrite ^/functions/v1/(.*)$ /$1 break; proxy_pass http://$up; }
