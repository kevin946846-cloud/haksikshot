server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    # 화면(index.html)과 스크립트·스타일 모두 매번 새 버전 확인(바뀌지 않았으면 304로 가볍게). Vercel 설정과 같음
    # 스크립트만 캐시하면 배포 직후 새 HTML + 예전 JS가 섞여 화면이 깨질 수 있음
    location = /index.html { add_header Cache-Control "public, max-age=0, must-revalidate"; }
    # vendor/(라이브러리·글꼴)는 거의 안 바뀌므로 7일 캐시. ^~ 로 아래 .js 규칙보다 먼저 적용
    location ^~ /vendor/   { add_header Cache-Control "public, max-age=604800"; }
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=0, must-revalidate"; }

    # 사용 평가 설문은 앱과 따로: 짧은 주소 /survey, /results
    location = /survey  { try_files /survey.html =404; }
    location = /results { try_files /results.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /healthz { access_log off; return 200 "ok\n"; }

    # Docker Compose로 띄울 때만 들어오는 백엔드 길 (docker/api-gateway.conf). 혼자 띄우면 비어 있음
    include /etc/nginx/haksikshot.d/*.conf;
    location / { try_files $uri /index.html; }
}
