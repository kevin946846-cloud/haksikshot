server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    # 화면(index.html)은 항상 새 버전 확인, 스크립트는 10분 캐시 (Vercel 설정과 같음)
    location = /index.html { add_header Cache-Control "public, max-age=0, must-revalidate"; }
    location ~* \.js$      { add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400"; }

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { try_files $uri /index.html; }
}
