<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>학식샷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app; each tab has its own format — kiosk grid (메뉴), goal board (추천), taste profile (내 입맛), leaderboard (랭킹) */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#18221e; --muted:#5d6b65; --line:#d5ddd8;
  --accent:#1f6b52; --accent-soft:#dcefe6; --ticket:#ffd84d; --ticket-ink:#3a2f00; --star:#e8a317;
  --sold:#b4322a; --sold-soft:#f8e1de; --diet:#2e7bbf; --diet-soft:#dfecf8; --bulk:#c4581f; --bulk-soft:#f9e4d6; --value:#6b4fb3; --value-soft:#e9e3f7;
  --display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1b2420; --ink:#e7eeea; --muted:#9aaba3; --line:#2c3833;
  --accent:#5cc49c; --accent-soft:#1f3a2f; --ticket:#e6c23c; --ticket-ink:#2a2200; --star:#f2b938;
  --sold:#f08a80; --sold-soft:#3a1f1c; --diet:#7db7ea; --diet-soft:#1c2c3b; --bulk:#f0915a; --bulk-soft:#3a2518; --value:#b4a0ee; --value-soft:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1b2420; --ink:#e7eeea; --muted:#9aaba3; --line:#2c3833;
  --accent:#5cc49c; --accent-soft:#1f3a2f; --ticket:#e6c23c; --ticket-ink:#2a2200; --star:#f2b938;
  --sold:#f08a80; --sold-soft:#3a1f1c; --diet:#7db7ea; --diet-soft:#1c2c3b; --bulk:#f0915a; --bulk-soft:#3a2518; --value:#b4a0ee; --value-soft:#2a2340; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0}
h1 span{color:var(--accent)}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 0;text-wrap:balance}
.date{font-size:13px;color:var(--muted);text-align:right}
.proto{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:10px;margin:0}
.hint{font-size:12px;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:14px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 12px;border:1px dashed var(--line);border-radius:14px}
/* ── 메뉴: 키오스크 그리드 ── */
.slotbar{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.slotbar .sl{padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.slotbar .sl.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.cat{font:inherit;font-family:var(--display);font-size:20px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 4px;cursor:pointer}
.cat[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cat small{font-family:var(--body);font-size:12px;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:340px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.tt{height:60px;border-radius:8px;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;color:var(--accent);margin-bottom:4px}
.tt img{width:100%;height:100%;object-fit:cover;display:block}
.tn{font-weight:700;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;word-break:keep-all}
.tp{font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500}
.tr{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tr b{color:var(--star);font-weight:400}
.badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.badge.sold{background:var(--sold);color:var(--surface)}
.badge.plan{background:var(--ticket);color:var(--ticket-ink)}
.badge.done{background:var(--accent);color:var(--surface)}
.tile.sold{background:var(--bg)}
.tile.sold .tt{filter:grayscale(1);opacity:.55}
.tile.sold .tn,.tile.sold .tp{color:var(--muted)}
.divider{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
/* ── 메뉴 추천: 목표 보드 ── */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goal{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.goal b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15}
.goal small{font-size:11.5px;color:var(--muted);line-height:1.35}
.goal[aria-pressed="true"]{border-color:var(--g);background:var(--gs)}
.g-diet{--g:var(--diet);--gs:var(--diet-soft)} .g-bulk{--g:var(--bulk);--gs:var(--bulk-soft)} .g-value{--g:var(--value);--gs:var(--value-soft)}
.pickhero{font:inherit;text-align:left;color:var(--ink);background:var(--gs);border:0;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.pickhero .eyebrow{font-size:12px;font-weight:700;color:var(--g);letter-spacing:.3px}
.pickhero .hn{font-family:var(--display);font-size:32px;line-height:1.1;word-break:keep-all}
.pickhero .why{font-size:14px}
.bignums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bignums div{background:var(--surface);border-radius:12px;padding:8px 10px}
.bignums b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.bignums span{font-size:11.5px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cr{font:inherit;color:var(--ink);text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:4px 10px;cursor:pointer}
.cr:last-child{border-bottom:0}
.cr .n{font-family:var(--display);font-size:20px;color:var(--g);grid-row:span 2}
.cr .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px;min-width:0}
.cr .t span:last-child{font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.bars{display:grid;grid-template-columns:44px 1fr 46px;gap:2px 6px;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;height:6px;border-radius:6px;background:var(--bg);overflow:hidden}
.bars i u{display:block;height:100%;border-radius:6px;background:var(--g)}
.bars i.k u{background:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 12px;margin:0}
/* ── 내 입맛: 프로필 ── */
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:86px;min-width:0}
.meal .lb{font-size:12px;font-weight:700;color:var(--muted)}
.meal b{font-size:14px;line-height:1.3;word-break:keep-all}
.meal small{font-size:11.5px;color:var(--muted)}
.meal.on{border-color:var(--accent);background:var(--accent-soft)}
.meal.on .lb{color:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.taste{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.taste .tl{font-size:12px;opacity:.75}
.taste .tt2{font-family:var(--display);font-size:28px;line-height:1.15}
.tags{display:flex;flex-direction:column;gap:6px}
.tag{display:grid;grid-template-columns:52px 1fr 28px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.tag i{display:block;height:8px;border-radius:8px;background:rgba(127,127,127,.3);overflow:hidden}
.tag i u{display:block;height:100%;background:var(--ticket);border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip small{color:var(--muted)}
.tl2{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.ti{font:inherit;color:var(--ink);text-align:left;background:none;border:0;position:relative;padding:4px 0 12px 16px;display:flex;flex-direction:column;cursor:pointer}
.ti::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.ti small{color:var(--muted);font-size:12px}
.ti b{font-size:14.5px}
/* ── 랭킹 ── */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rank-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rk{font:inherit;color:var(--ink);text-align:left;background:none;border:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.rk:last-child{border-bottom:0}
.rk .n{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.rk:nth-child(-n+3) .n{color:var(--accent)}
.rk .m{min-width:0}.rk .m b{display:block;font-size:14.5px}.rk .m small{color:var(--muted);font-size:12px}
.rk .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.bar{display:block;height:4px;background:var(--bg);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* ── 버튼 ── */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;font:inherit;font-size:14px;font-weight:700;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ticket{background:var(--ticket);border-color:var(--ticket);color:var(--ticket-ink)}
.btn.warn{color:var(--sold);border-color:var(--sold-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn input{display:none}
.btn small{display:block;font-weight:400;font-size:11.5px;opacity:.8}
:is(.btn,.cat,.tab,.tile,.goal,.pickhero,.cr,.rk,.chip,.ti):focus-visible,.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
/* ── 상세 ── */
#detail{border:0;padding:0;width:100%;max-width:560px;height:min(94vh,940px);max-height:none;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow:auto}
#detail::backdrop{background:rgba(0,0,0,.5)}
.dwrap{display:flex;flex-direction:column;gap:16px;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.dbar{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.dbar b{font-size:13px;color:var(--muted);font-weight:500}
.x{font:inherit;font-size:13px;font-weight:700;background:var(--bg);border:0;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.hero{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);text-align:center;font-size:13px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .big{font-family:var(--display);font-size:44px;color:var(--accent)}

.stamp .ok{background:rgba(31,107,82,.9)}
.sold .hero img{filter:grayscale(1)}
.dname{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dname h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;word-break:keep-all}
.dname .price{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .s{color:var(--star);letter-spacing:1px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}

.pill.ok{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel h4{margin:0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h4 small{font-weight:400;color:var(--muted)}
.nutri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nutri div{background:var(--surface);border-radius:10px;padding:8px 6px;text-align:center}
.nutri b{display:block;font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.nutri span{font-size:11px;color:var(--muted)}
.nrow{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ai em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.status{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.status.bad{background:var(--sold-soft);color:var(--sold)}
.proof{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.proof img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.slotpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--star)}
textarea{font:inherit;width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.reviews{display:flex;flex-direction:column;gap:10px}
.rv{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:14px}
.rv:last-child{border-bottom:0}
.rv .s{color:var(--star);font-size:13px}
.rv small{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tab{flex:1;max-width:140px;font:inherit;font-size:13.5px;font-weight:700;padding:14px 4px;border:0;background:none;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.herowrap{display:flex;flex-direction:column;gap:6px}
.vr{border-bottom:1px solid var(--line)}.vr:last-child{border-bottom:0}.vr .cr{border-bottom:0;width:100%}
.vote{display:flex;gap:6px;padding:0 12px 10px 46px}
.herowrap .vote{padding:0}

.vote button[aria-pressed="true"][data-vote="1"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.vote button[aria-pressed="true"][data-vote="-1"]{background:var(--sold);border-color:var(--sold);color:var(--surface)}
.mv{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px}.mv.up{color:var(--accent)}.mv.dn{color:var(--sold)}
.wcbanner{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wcbanner div{display:flex;flex-direction:column;gap:2px;min-width:0}

.wcbanner small{font-size:12px;opacity:.75}
.wcbanner .btn{flex:0 0 auto}
.eyebrow2{font-size:12px;font-weight:700;color:var(--ticket);letter-spacing:.3px}
#wc{border:0;padding:0;width:100%;max-width:560px;height:min(94vh,940px);max-height:none;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow:auto}
#wc::backdrop{background:rgba(0,0,0,.6)}
.wcbody{padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.wcpair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.vs{font-family:var(--display);font-size:22px;color:var(--bulk)}
.wcc{font:inherit;color:var(--ink);text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.wcc:hover{border-color:var(--accent)}
.wcc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wci{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:52px;color:var(--accent);margin-bottom:6px}

function portionOf(id){const r=st.mine[id];return (r&&r.f&&r.f.portion)||(r&&r.portion)||(st.photos[id]&&st.photos[id].portion)||null}
function nut(m){const ph=st.photos[m.id];if(ph&&ph.nutrition)return ph.nutrition;const f=PF[portionOf(m.id)]||1;if(f===1)return m.n;return {kcal:Math.round(m.n.kcal*f),protein:Math.round(m.n.protein*f),carbs:Math.round(m.n.carbs*f),sugar:Math.round(m.n.sugar*f)}}

function weekStart(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const wkKey=t=>{const d=new Date(weekStart(t));return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function votesFor(id,t){const k=wkKey(t)+"|"+id,a=AGG.votes[k]||{up:0,down:0},v=st.votes[k]||0;return {up:a.up+(v===1?1:0),down:a.down+(v===-1?1:0),mine:v}}
function valueScore(m){
  const lw=votesFor(m.id,Date.now()-7*DAY),tot=lw.up+lw.down,r=rate(m.id,"all");
  return m.off+(tot?10*(lw.up-lw.down)/Math.max(5,tot):0)+(r.n>=3?(r.avg-3)*5:0)+(PF[portionOf(m.id)]?(PF[portionOf(m.id)]-1)*40:0)+({"또 먹을래요":3,"다신 안 먹어요":-3}[(st.mine[m.id]&&st.mine[m.id].f||{}).again]||0);
}
function rate(id,scope){
  const base=(RATE[id]||{})[scope]||[0,0];let sum=base[0]*base[1],n=base[1];
  const mine=st.mine[id];if(mine&&(scope==="all"||Date.now()-mine.at<7*DAY)){sum+=mine.s;n++}
  return {avg:n?sum/n:0,n};
}
const weekSales=id=>(SALES[id]||0)+st.meals.filter(x=>x.id===id&&Date.now()-x.at<7*DAY).length;
const recentPhoto=id=>{const p=st.photos[id];return p&&Date.now()-p.at<7*DAY?p:null};

  $("#rank-sales").innerHTML=!sales.length?`<div class="empty">이번 주 먹음 체크가 쌓이면 순위가 생겨요</div>`:sales.map((x,i)=>`<button class="rk" data-open="${x.m.id}"><span class="n">${i+1}</span><span class="m"><b>${esc(x.m.name)}</b><small>${x.m.cat} · ${won(x.m.price)}</small><span class="bar"><i style="width:${Math.round(x.v/max*100)}%"></i></span></span><span class="v">${x.v}그릇</span></button>`).join("");
  const rs=MENUS.map(m=>({m,r:rate(m.id,rankScope)})).filter(x=>x.r.n>=5).sort((a,b)=>b.r.avg-a.r.avg||b.r.n-a.r.n).slice(0,10);
  $("#rank-star").innerHTML=rs.length?rs.map((x,i)=>`<button class="rk" data-open="${x.m.id}"><span class="n">${i+1}</span><span class="m"><b>${esc(x.m.name)}</b><small>평가 ${x.r.n}개 · ${x.m.cat}</small></span><span class="v"><span style="color:var(--star)">★</span> ${x.r.avg.toFixed(2)}</span></button>`).join(""):`<div class="empty">아직 순위를 매길 만큼 평가가 없어요</div>`;
  document.querySelectorAll("#rank-seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rank===rankScope));
  $("#wc-themes").innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="wct" data-wcstart="${k}"><b>${t.title}</b><small>${t.sub}</small><span>시작하기</span></button>`).join("");
  $("#wc-seg").innerHTML=Object.entries(THEMES).map(([k,t])=>`<button data-wcrank="${k}" aria-pressed="${k===wcTheme}">${t.short}</button>`).join("");
  const ws=Object.entries(wcStats(wcTheme)).map(([id,x])=>({m:byId(id),x,g:x.w+x.l})).filter(r=>r.m&&r.x.w>0).sort((a,b)=>b.x.champ-a.x.champ||b.x.w/b.g-a.x.w/a.g||b.x.w-a.x.w).slice(0,10);
  $("#rank-wc").innerHTML=ws.length?ws.map((r,i)=>`<button class="rk" data-open="${r.m.id}"><span class="n">${i+1}</span><span class="m"><b>${esc(r.m.name)}</b><small>1:1 승률 ${Math.round(r.x.w/r.g*100)}% (${r.x.w}승 ${r.x.l}패)</small></span><span class="v">우승 ${r.x.champ}회</span></button>`).join(""):`<div class="empty">월드컵을 한 판 하면 순위가 생겨요</div>`;
}

let wc=null,wcTheme="fav";
const THEMES={
 fav:{short:"최애",title:"나의 최애 메뉴는?",sub:"그냥 제일 좋아하는 메뉴",q:"둘 중 더 좋아하는 메뉴는?",win:"나의 최애 메뉴"},

 fresh:{short:"신입생 추천",title:"신입생에게 딱 하나 추천한다면?",sub:"다래락 처음 온 후배에게",q:"다래락에 처음 온 신입생에게 추천할 메뉴는?",win:"내가 추천하는 신입생 메뉴"},

};
if(!st.wcReset2){st.wc={byTheme:{},history:[]};st.wcReset2=true}
const wcStats=t=>(st.wc.byTheme[t]=st.wc.byTheme[t]||{});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const roundName=n=>n===2?"결승":n+"강";
function startWC(theme){wc={theme,round:shuffle(MENUS.filter(m=>m.price>1000).map(m=>m.id)).slice(0,16),next:[],i:0,champ:null,log:[]};showSplash();renderWC();const d=$("#wc");if(!d.open)d.showModal()}
function wcCard(id,k){const m=byId(id),ph=st.photos[id],r=rate(id,"all");
  return `<button class="wcc" data-wcpick="${k}"><span class="wci">${ph?`<img src="${ph.src}" alt="">`:esc(m.name[0])}</span><b>${esc(m.name)}</b><small>${won(m.price)} · ${m.cat}</small><small>${m.tags.map(t=>"#"+t).join(" ")}</small>${r.n?`<small>★ ${r.avg.toFixed(1)}</small>`:""}</button>`}
function renderWC(){
  if(!wc)return;
  const T=THEMES[wc.theme];
  if(wc.champ){const m=byId(wc.champ),sc=wcStats(wc.theme)[m.id]||{};
    $("#wc-round").textContent="우승";
    $("#wc-body").innerHTML=`<div class="wcwin"><span class="eyebrow2">${T.win}</span><span class="wcwn">${esc(m.name)}</span><span>${won(m.price)} · ${m.tags.map(t=>"#"+t).join(" ")}</span><span class="hint">「${T.title}」 누적 우승 ${sc.champ||0}회</span>
      <div class="actions"><button class="btn primary" data-open="${m.id}">메뉴 보기</button><button class="btn" data-wcstart="${wc.theme}">다시 하기</button></div></div>`;return}
  const n=wc.round.length,a=wc.round[wc.i],b=wc.round[wc.i+1];
  $("#wc-round").textContent=T.title;
  const steps=[16,8,4,2].map(r=>`<span class="${r===n?"now":r>n?"done":""}">${roundName(r)}</span>`).join("");
  if(wc.splash){
    $("#wc-body").innerHTML=`<div class="wcsplash" data-r="${n}"><span class="wcsteps">${steps}</span><span class="sbig">${roundName(n)}</span><span class="ssub">${({16:"다래락 대표 16개 메뉴 입장!",8:"8개 메뉴가 살아남았어요",4:"준결승! 이제 4개뿐이에요",2:"결승전! 최후의 한 그릇은?"})[n]}</span><div class="wcleft">${wc.round.map(id=>`<span>${esc(byId(id).name)}</span>`).join("")}</div></div>`;
    return;
  }
  $("#wc-body").innerHTML=`<div class="wchead" data-r="${n}"><span class="wcsteps">${steps}</span><span class="wcbig">${roundName(n)}</span>${n===2?`<span class="wccount">마지막 대결</span>`:`<span class="wcdots" aria-label="${n/2}경기 중 ${wc.i/2+1}번째">${Array.from({length:n/2},(_,j)=>`<i class="${j<wc.i/2?"d":j===wc.i/2?"c":""}"></i>`).join("")}</span>`}</div><p class="wcq">${T.q}</p><div class="wcpair">${wcCard(a,0)}<span class="vs">VS</span>${wcCard(b,1)}</div><div class="wcprog"><i style="width:${Math.round(({16:0,8:8,4:12,2:14}[n]+wc.i/2)/15*100)}%"></i></div>`;
}
function showSplash(){wc.splash=true;const me=wc;clearTimeout(showSplash.t);showSplash.t=setTimeout(()=>{if(wc===me){wc.splash=false;renderWC()}},1600)}
function pickWC(k){if(wc.splash)return;
  const w=wc.round[wc.i+k],l=wc.round[wc.i+1-k];
  wc.log.push([w,l]);wc.next.push(w);wc.i+=2;
  if(wc.i>=wc.round.length){
    if(wc.next.length===1){
      // 결승까지 끝낸 판만 기록에 남김
      const S=wcStats(wc.theme);
      wc.log.forEach(([a,b])=>{S[a]=S[a]||{w:0,l:0,champ:0};S[b]=S[b]||{w:0,l:0,champ:0};S[a].w++;S[b].l++});
      wc.champ=w;S[w].champ++;st.wc.history.push({at:Date.now(),winner:w,theme:wc.theme});API.wc(wc.theme,w,wc.log);save();renderRank();
    } else {wc.round=wc.next;wc.next=[];wc.i=0;showSplash()}
  }
  renderWC();
}

  if(e.target.closest(".wcsplash")&&wc){wc.splash=false;renderWC();return}

  if(e.target.closest("[data-wcclose]")){$("#wc").close();return}

  const op=e.target.closest("#wc [data-open]");if(op){$("#wc").close();openDetail(op.dataset.open);return}
  const o=e.target.closest("[data-open]");if(o){openDetail(o.dataset.open);return}
  const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;render();return}
  const so=e.target.closest("[data-sort]");if(so){sortBy=so.dataset.sort;renderMenus();return}
  const g=e.target.closest("[data-goal]");if(g){goal=g.dataset.goal;renderReco();return}

  const v=e.target.closest("[data-view]");if(v){show(v.dataset.view);return}
  const s=e.target.closest("[data-star]");if(s){draft.s=+s.dataset.star;renderDetail();return}
  const qb=e.target.closest("[data-q]");if(qb){const k=qb.dataset.q,v=qb.dataset.qv;if(draft.f[k]===v)delete draft.f[k];else draft.f[k]=v;renderDetail();return}
  const vt=e.target.closest("[data-vote]");if(vt){const k=wkKey()+"|"+vt.dataset.id,v=+vt.dataset.vote;if(st.votes[k]===v)delete st.votes[k];else st.votes[k]=v;API.vote(k,st.votes[k]);save();renderReco();toast(st.votes[k]?(v>0?"추천했어요":"비추천했어요")+". 다음 주 랭킹에 반영돼요":"투표를 취소했어요");return}
  const sl=e.target.closest("[data-slot]");if(sl&&openId){
    if(todayMeals().length>=3||slotUsed(sl.dataset.slot)){toast("이미 체크한 끼니예요");return}
    st.meals.push({id:openId,slot:sl.dataset.slot,at:Date.now()});API.eat(openId,sl.dataset.slot);delete st.plans[openId];slotOpen=false;
    if(st.mine[openId])st.mine[openId].verified=true;
    toast(`${sl.dataset.slot} 먹음 체크 완료. 사진도 올릴 수 있어요`);save();render();return}
  const b=e.target.closest("button[data-a]");if(!b||!openId)return;const id=openId,a=b.dataset.a;
  if(a==="eat"){slotOpen=true;renderDetail();return}
  if(a==="slotcancel"){slotOpen=false;renderDetail();return}
  if(a==="pick"){st.plans[id]=Date.now();toast("먹을 예정에 담았어요")}
  if(a==="unpick"){delete st.plans[id];toast("예정을 취소했어요")}
  if(a==="uneat"){const x=eatenToday(id);st.meals=st.meals.filter(y=>y!==x);API.uneat(id);if(st.mine[id])st.mine[id].verified=false;toast("먹음 체크를 취소했어요")}
  if(a==="restock"){delete st.sold[id];API.restock(id);toast("다시 있음으로 바꿨어요")}
  if(a==="submit"){if(!draft.s){toast("별점을 골라 주세요");return}st.mine[id]={s:draft.s,t:draft.t.trim(),f:{...draft.f},at:Date.now(),verified:!!eatenToday(id)};API.review(id,st.mine[id]);toast("평가를 등록했어요")}
  save();render();
});

      const r=await aiCheckFood(file,m);
      if(r.skipped){st.photos[id]={src,at:Date.now(),verified:false};lastMsg={id,text:"지금은 AI 확인이 어려워 미확인 사진으로 올렸어요."}}
      else if(r.match===true){
        const n=r.nutrition&&typeof r.nutrition.kcal==="number"?{kcal:Math.round(r.nutrition.kcal),protein:Math.round(r.nutrition.protein||0),carbs:Math.round(r.nutrition.carbs||0),sugar:Math.round(r.nutrition.sugar||0)}:null;
        st.photos[id]={src,at:Date.now(),verified:true,nutrition:n,portion:r.portion};lastMsg={id,text:"사진이 등록됐어요. "+(r.reason||"")};
      } else lastMsg={id,bad:true,text:`등록할 수 없어요. ${r.reason||m.name+" 사진이 아닌 것 같아요."}`};
    } else {
      const r=await aiCheckSold(file,m);
      if(r.skipped){st.sold[id]={at:Date.now(),who:"나",verified:false,proof:src,reason:"AI 미확인"};lastMsg={id,text:"이 화면에서는 AI 확인을 쓸 수 없어 미확인 제보로 등록했어요."}}
      else if(r.ok===true){st.sold[id]={at:Date.now(),who:"나",verified:true,proof:src,reason:r.reason||""};lastMsg={id,text:"품절 제보가 확인됐어요."}}
      else lastMsg={id,bad:true,text:`품절을 확인할 수 없어요. ${r.reason||"키오스크에서 이 메뉴의 품절 표시가 보이게 찍어 주세요."}`};
    }
  }catch(err){
    // AI 확인을 못 해도 사진은 '미확인'으로 올림 (거절된 경우만 제외)
    if(err&&err.code==="image_rejected"){lastMsg={id,bad:true,text:aiErr(err)}}
    else{
      try{const src=await shrink(file);
        if(a==="photo"){st.photos[id]={src,at:Date.now(),verified:false};lastMsg={id,text:"AI 확인 없이 미확인 사진으로 올렸어요. ("+aiErr(err)+")"}}
        else{st.sold[id]={at:Date.now(),who:"나",verified:false,proof:src,reason:"AI 미확인"};lastMsg={id,text:"AI 확인 없이 미확인 제보로 등록했어요. ("+aiErr(err)+")"}}
      }catch(e2){lastMsg={id,bad:true,text:"사진을 읽지 못했어요. 다른 사진을 골라 주세요"}}
    }
  }
  delete busy[id];inp.value="";save();render();
});
function show(v){
  ["menu","reco","taste","rank"].forEach(k=>$("#view-"+k).hidden=k!==v);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  window.scrollTo(0,0);
}
save();render();
</script>
